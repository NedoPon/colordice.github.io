<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Dice Game</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#7eb6f4;font-family:Arial,sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;min-height:100vh;user-select:none}
.game-container{display:flex;gap:20px;max-width:1200px;width:100%;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.panel{background:#4a90e2;border:4px solid #fff;border-radius:20px;padding:15px;box-shadow:0 8px 0 rgba(0,0,0,.15)}
.panel-title{text-align:center;font-size:22px;font-weight:bold;margin-bottom:15px;text-transform:uppercase;text-shadow:1px 1px 2px rgba(0,0,0,.3)}
.colors-panel{width:220px}.color-row{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.2);margin-bottom:8px;padding:8px 12px;border-radius:8px;font-weight:bold}.color-row:last-child{margin-bottom:0}
.color-dot{width:22px;height:22px;border-radius:6px;border:2px solid #fff}
.main-panel{width:500px;display:flex;flex-direction:column;align-items:center}
.controls-top{display:flex;gap:15px;width:100%;margin-bottom:25px}
select{flex:1;padding:10px;border-radius:8px;border:2px solid #fff;background:#fff;color:#333;font-weight:bold;outline:none;cursor:pointer}
.dice-container{display:flex;gap:15px;margin:15px 0 25px;min-height:100px;align-items:center;justify-content:center;flex-wrap:wrap}
.die{width:85px;height:85px;border-radius:18px;border:4px solid #fff;box-shadow:0 0 15px rgba(255,255,255,.6),inset 0 0 10px rgba(0,0,0,.15);display:flex;justify-content:center;align-items:center;transition:transform .15s}
.die.rolling{animation:shake .5s ease}
.die::after{content:"";width:20px;height:20px;background:#fff;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.2)}
@keyframes shake{0%{transform:rotate(0) scale(1)}20%{transform:rotate(-10deg) scale(1.05)}40%{transform:rotate(10deg) scale(1.05)}60%{transform:rotate(-8deg) scale(1.05)}80%{transform:rotate(8deg) scale(1.05)}100%{transform:rotate(0) scale(1)}}
.btn-roll{width:100%;background:#ffd200;color:#704600;border:0;border-bottom:6px solid #dca600;border-radius:12px;padding:15px;font-size:24px;font-weight:bold;cursor:pointer;text-transform:uppercase;text-shadow:1px 1px 0 rgba(255,255,255,.5);box-shadow:0 4px 10px rgba(0,0,0,.2);transition:transform .1s}
.btn-roll:hover{filter:brightness(1.05)}.btn-roll:active{transform:translateY(4px);border-bottom-width:2px}.btn-roll:disabled{opacity:.7;cursor:not-allowed}
.rules-panel{width:260px;display:flex;flex-direction:column}.rule-item{background:#fff;color:#333;margin-bottom:8px;padding:12px;border-radius:8px;font-size:13px;font-weight:bold;display:flex;justify-content:space-between;gap:8px}.rule-item:last-child{margin-bottom:0}
.rule-lose{color:#d0021b}.rule-win{color:#417505}.rule-reroll{color:#4a90e2}
.result-text{font-size:22px;font-weight:bold;margin-top:15px;text-align:center;min-height:30px;text-shadow:2px 2px 4px rgba(0,0,0,.4)}
.admin-footer{width:100%;max-width:1004px;background:#2c3e50;border:4px solid #fff;border-radius:20px;padding:20px;box-shadow:0 8px 0 rgba(0,0,0,.15)}
.admin-footer h3{margin:0 0 20px;color:#f1c40f;text-align:center;font-size:18px;text-transform:uppercase}
.chance-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.chance-control{background:#34495e;padding:12px;border-radius:10px;display:flex;flex-direction:column;gap:8px;border:1px solid #455a64}
.chance-control label{font-size:14px;font-weight:bold;display:flex;justify-content:space-between;gap:10px}.chance-value{min-width:42px;text-align:right}.chance-control input[type=range]{width:100%;cursor:pointer}
.bg-red{background:linear-gradient(135deg,#ff5e57,#ff3b30)}.bg-orange{background:linear-gradient(135deg,#ffb347,#ff9500)}.bg-yellow{background:linear-gradient(135deg,#ffea00,#ffcc00)}.bg-green{background:linear-gradient(135deg,#66f17e,#4cd964)}.bg-blue{background:linear-gradient(135deg,#54a0ff,#007aff)}.bg-purple{background:linear-gradient(135deg,#a55eea,#5856d6)}
@media(max-width:700px){body{padding:10px}.main-panel,.colors-panel,.rules-panel{width:100%}.chance-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="game-container">
<div class="panel colors-panel">
<div class="panel-title">Цвета</div>
<div class="color-row"><span>L Trade</span><div class="color-dot bg-red"></div></div>
<div class="color-row"><span>No Thanks</span><div class="color-dot bg-orange"></div></div>
<div class="color-row"><span>Deal?</span><div class="color-dot bg-yellow"></div></div>
<div class="color-row"><span>Fair Trade</span><div class="color-dot bg-green"></div></div>
<div class="color-row"><span>Last Offer</span><div class="color-dot bg-blue"></div></div>
<div class="color-row"><span>Add More</span><div class="color-dot bg-purple"></div></div>
</div>

<div class="panel main-panel">
<div class="panel-title">Color Dice</div>
<div class="controls-top">
<select id="dice-count">
<option value="1">1 кубик</option>
<option value="2">2 кубика</option>
<option value="3" selected>3 кубика</option>
</select>
<select><option>Цветные кубики</option></select>
</div>
<div class="dice-container" id="dice-wrapper"></div>
<button class="btn-roll" id="roll-button">Бросить!</button>
<div class="result-text" id="result-display"></div>
</div>

<div class="panel rules-panel">
<div class="panel-title">Правила</div>
<div class="rule-item"><span>Ноль совпадений</span><span class="rule-lose">— Проигрыш</span></div>
<div class="rule-item"><span>Одно совпадение</span><span class="rule-win">— Победа</span></div>
<div class="rule-item"><span>Два совпадения</span><span class="rule-reroll">— Перекрут</span></div>
<div class="rule-item"><span>Три совпадения</span><span class="rule-win">— Победа</span></div>
</div>
</div>

<div class="admin-footer">
<h3>⚙️ Настройка вероятности выпадения</h3>
<div class="chance-grid">
<div class="chance-control"><label><span style="color:#ff5e57">🔴 Красный (L Trade)</span><span class="chance-value" id="value-red">16</span></label><input type="range" id="weight-red" min="0" max="100" value="16"></div>
<div class="chance-control"><label><span style="color:#ffb347">🟠 Оранжевый (No Thanks)</span><span class="chance-value" id="value-orange">16</span></label><input type="range" id="weight-orange" min="0" max="100" value="16"></div>
<div class="chance-control"><label><span style="color:#ffea00">🟡 Желтый (Deal?)</span><span class="chance-value" id="value-yellow">16</span></label><input type="range" id="weight-yellow" min="0" max="100" value="16"></div>
<div class="chance-control"><label><span style="color:#66f17e">🟢 Зеленый (Fair Trade)</span><span class="chance-value" id="value-green">16</span></label><input type="range" id="weight-green" min="0" max="100" value="16"></div>
<div class="chance-control"><label><span style="color:#54a0ff">🔵 Синий (Last Offer)</span><span class="chance-value" id="value-blue">16</span></label><input type="range" id="weight-blue" min="0" max="100" value="16"></div>
<div class="chance-control"><label><span style="color:#a55eea">🟣 Фиолетовый (Add More)</span><span class="chance-value" id="value-purple">16</span></label><input type="range" id="weight-purple" min="0" max="100" value="16"></div>
</div>
</div>

<script>
const colors=[
{name:"L Trade",className:"bg-red",weightId:"weight-red",valueId:"value-red"},
{name:"No Thanks",className:"bg-orange",weightId:"weight-orange",valueId:"value-orange"},
{name:"Deal?",className:"bg-yellow",weightId:"weight-yellow",valueId:"value-yellow"},
{name:"Fair Trade",className:"bg-green",weightId:"weight-green",valueId:"value-green"},
{name:"Last Offer",className:"bg-blue",weightId:"weight-blue",valueId:"value-blue"},
{name:"Add More",className:"bg-purple",weightId:"weight-purple",valueId:"value-purple"}
];

const diceWrapper=document.getElementById("dice-wrapper");
const diceCount=document.getElementById("dice-count");
const rollButton=document.getElementById("roll-button");
const resultDisplay=document.getElementById("result-display");

function updateDiceCount(){
const count=Number(diceCount.value);
diceWrapper.innerHTML="";
for(let i=0;i<count;i++){
const die=document.createElement("div");
die.className="die "+colors[i%colors.length].className;
diceWrapper.appendChild(die);
}
}

function getWeights(){
return colors.map(color=>({...color,weight:Number(document.getElementById(color.weightId).value)}));
}

function getWeightedColor(){
const weighted=getWeights();
const total=weighted.reduce((sum,color)=>sum+color.weight,0);
if(total<=0)return colors[Math.floor(Math.random()*colors.length)];
let random=Math.random()*total;
for(const color of weighted){
random-=color.weight;
if(random<=0)return color;
}
return weighted[weighted.length-1];
}

function rollDice(){
const dice=[...document.querySelectorAll(".die")];
if(!dice.length)return;
rollButton.disabled=true;
resultDisplay.textContent="Бросок...";
dice.forEach(die=>{die.classList.remove("rolling");void die.offsetWidth;die.classList.add("rolling")});

setTimeout(()=>{
const results=[];
dice.forEach(die=>{
const color=getWeightedColor();
colors.forEach(item=>die.classList.remove(item.className));
die.classList.add(color.className);
results.push(color);
});

const counts={};
results.forEach(result=>counts[result.name]=(counts[result.name]||0)+1);
const maxMatches=Math.max(...Object.values(counts));

if(maxMatches===1)resultDisplay.textContent="🎉 Победа!";
else if(maxMatches===2)resultDisplay.textContent="🔄 Перекрут!";
else resultDisplay.textContent="🏆 Победа!";

rollButton.disabled=false;
},500);
}

colors.forEach(color=>{
const slider=document.getElementById(color.weightId);
const value=document.getElementById(color.valueId);
slider.addEventListener("input",()=>value.textContent=slider.value);
});

diceCount.addEventListener("change",updateDiceCount);
rollButton.addEventListener("click",rollDice);
updateDiceCount();
</script>
</body>
</html>
